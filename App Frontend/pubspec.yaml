name: oil_spill_alert_app
description: "Mobile alert app for the SIH oil-spill anomaly detection system. Receives push notifications when a new oil spill is detected, shows the location on a map, and keeps a local history of alerts."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Push notifications
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Networking
  http: ^1.2.2

  # Map to show the spill location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local storage (alert history, backend URL, FCM token cache)
  shared_preferences: ^2.3.2

  # Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
