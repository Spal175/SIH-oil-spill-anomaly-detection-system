<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OceanWatch — Maritime Surveillance Dashboard</title>
  <meta name="description" content="Real-time maritime surveillance dashboard for oil spill detection and vessel tracking." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts (cosmetic; page falls back to system fonts if unreachable) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOP NAVIGATION BAR -->
  <header class="topbar" id="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">OceanWatch</span>
      <span class="brand-subtitle">Maritime Surveillance</span>
    </div>

    <div class="topbar-status">
      <div class="status-pill" id="ws-status-pill">
        <div class="status-dot" id="ws-dot"></div>
        <span class="status-label">AIS Stream</span>
        <span class="status-value" id="ws-status-text">Connecting</span>
      </div>

      <div class="status-pill" id="api-status-pill">
        <div class="status-dot" id="api-dot"></div>
        <span class="status-label">AI Backend</span>
        <span class="status-value" id="api-status-text">Checking</span>
      </div>

      <div class="topbar-stats">
        <div class="stat-item">
          <span class="stat-value" id="stat-vessels">0</span>
          <span class="stat-label">Vessels</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-value spill-stat" id="stat-spills">0</span>
          <span class="stat-label">Spills</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-msgs">0</span>
          <span class="stat-label">Msgs/s</span>
        </div>
      </div>
    </div>

    <div class="topbar-actions">
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="main-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linejoin="round" d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <h3>Live Vessels</h3>
          <span class="badge" id="vessel-count-badge">0</span>
        </div>
        <div class="vessel-list" id="vessel-list">
          <div class="list-empty" id="vessel-empty">
            <div class="empty-icon">⚓</div>
            <p>Awaiting AIS data…</p>
          </div>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" d="M12 9v4m0 4h.01"/>
            <path stroke-linejoin="round" d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
          <h3>Spill Detections</h3>
          <span class="badge badge-alert" id="spill-count-badge">0</span>
        </div>
        <div class="spill-list" id="spill-list">
          <div class="list-empty" id="spill-empty">
            <div class="empty-icon">🛢️</div>
            <p>No detections yet.</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAP AREA -->
    <div class="map-container">
      <div id="map"></div>

      <div class="map-overlay-controls">
        <button class="map-btn" id="btn-fit-bounds" title="Fit to Area of Interest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
          </svg>
        </button>
        <button class="map-btn active" id="btn-toggle-trails" title="Toggle vessel trails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </button>
      </div>

      <div class="map-legend">
        <div class="legend-item"><span class="legend-dot vessel-dot"></span>Vessel</div>
        <div class="legend-item"><span class="legend-dot spill-dot"></span>Oil Spill</div>
        <div class="legend-item"><span class="legend-dot candidate-dot"></span>Candidate</div>
      </div>

      <div class="map-coords" id="map-coords">–.–––– N, –.–––– E</div>
    </div>

    <!-- RIGHT DETAIL PANEL (slides in on selection) -->
    <aside class="detail-panel" id="detail-panel">
      <button class="panel-close" id="btn-close-panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="panel-content" id="panel-content"></div>
    </aside>

  </main>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- App entry point -->
  <script defer src="js/app.js"></script>
</body>
</html>
